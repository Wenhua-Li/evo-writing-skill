<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">EvoWrite social preview</title>
  <desc id="desc">EvoWrite social card with a concise before and after example.</desc>
  <defs>

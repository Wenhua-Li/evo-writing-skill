    <text x="48" y="66" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650">Before</text>
    <text x="48" y="106" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">“may potentially</text>
    <text x="48" y="140" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">significantly outperform...”</text>
    <text x="344" y="66" fill="#5eead4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="650">After</text>
    <text x="344" y="106" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">“On the tested problems,</text>
    <text x="344" y="140" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19">the proposed method...”</text>

  <text x="596" y="200" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30">Natural writing for Evolutionary Computation papers</text>
  <text x="596" y="246" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Anti-AI tells · Anti-defensive prose · Evidence-aware EC writing</text>

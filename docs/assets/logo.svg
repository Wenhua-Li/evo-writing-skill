  <g fill="#f8fafc" filter="url(#glow)">
    <circle cx="116" cy="382" r="19"/><circle cx="184" cy="320" r="16"/><circle cx="242" cy="275" r="14"/><circle cx="302" cy="220" r="15"/><circle cx="404" cy="112" r="19"/>
  </g>
  <text x="256" y="452" text-anchor="middle" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="700">EvoWrite</text>
</svg>
